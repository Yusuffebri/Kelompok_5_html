<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Chat - Travel Lovindra</title>
    <link rel="icon" type="image/png" href="image/Logo.jpeg" sizes="16x16">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e9ecef;
            padding: 20px;
        }
        .chat-container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }
        .chat-header {
            font-size: 24px;
            margin-bottom: 20px;
            color: #2a5298;
            text-align: center;
        }
        .messages {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            background-color: #f8f9fa;
        }
        .message {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
            position: relative;
            max-width: 80%;
        }
        .message.user {
            background-color: #d1e7dd;
            margin-left: auto;
            color: #0f5132;
        }
        .message.user .sender {
            color: #0f5132;
        }
        .message.driver {
            background-color: #cfe2ff;
            color: #1e1e1e;
        }
        .message.driver .sender {
            color: #1e1e1e;
        }
        .input-container {
            display: flex;
        }
        .input-container input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-right: 10px;
        }
        .input-container button {
            padding: 10px;
            background-color: #2a5298;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .input-container button:hover {
            background-color: #1e3c72;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header" id="driverName">Chat dengan Sopir</div>
        <div class="messages" id="messages">
            <!-- Pesan akan ditampilkan di sini -->
        </div>
        <div class="input-container">
            <input type="text" id="messageInput" placeholder="Ketik pesan...">
            <button id="sendButton">Kirim</button>
        </div>
    </div>

    <script>
        // Mendapatkan parameter dari URL
        const urlParams = new URLSearchParams(window.location.search);
        const driverName = urlParams.get('driver');
        document.getElementById('driverName').textContent = `Chat dengan ${driverName}`;

        // Mengirim pesan
        document.getElementById('sendButton').addEventListener('click', function() {
            const messageInput = document.getElementById('messageInput');
            const messageText = messageInput.value.trim();
            if (messageText) {
                // Menampilkan pesan di area chat
                const messagesDiv = document.getElementById('messages');
                
                // Pesan dari pengguna
                const userMessageDiv = document.createElement('div');
                userMessageDiv.classList.add('message', 'user');
                userMessageDiv.innerHTML = `<span class="sender">Anda:</span> ${messageText}`;
                messagesDiv.appendChild(userMessageDiv);
                
                // Simulasi pesan dari sopir (untuk contoh)
                const driverMessageDiv = document.createElement('div');
                driverMessageDiv.classList.add('message', 'driver');
                driverMessageDiv.innerHTML = `<span class="sender">${driverName}:</span> Baik, saya akan segera ke lokasi.`;
                messagesDiv.appendChild(driverMessageDiv);
                
                messageInput.value = ''; // Mengosongkan input
                messagesDiv.scrollTop = messagesDiv.scrollHeight; // Scroll ke bawah
            }
        });
    </script>

</body>
</html>
